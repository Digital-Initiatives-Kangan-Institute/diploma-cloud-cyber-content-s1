AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  YAT Enrolline - AT3 IMPROVED state, applied as a CloudFormation change-set (stack update) to the
  SAME stack created from baseline.yaml. Same logical IDs, so changes are in-place/additive - no
  resource is replaced.

  Changes: the application tier becomes Multi-AZ (the ASG spreads across two AZs behind the internal
  ALB, min 2 / desired 2); the database becomes a Multi-AZ deployment with a synchronous standby in the
  second AZ and automatic failover; an S3 lifecycle tiers older attachments for cost. MultiAZ is an
  in-place update property, so the database instance is modified, never replaced, and the data is
  retained. The cross-Region backup copy to Melbourne (ap-southeast-4) remains an out-of-band step (see
  README).

Parameters:
  EnvName:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Environment suffix used in resource names.

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Auto-resolves the latest Amazon Linux 2023 AMI (no hardcoded AMI to age).

  InstanceType:
    Type: String
    Default: t3.micro
    Description: Enrolline application tier EC2 instance type (AWS Academy may restrict types).

  DBEngine:
    Type: String
    Default: postgres
    AllowedValues: [postgres]
    Description: >-
      RDS engine. Enrolline runs on Amazon RDS for PostgreSQL (see the Enrolline
      Infrastructure Specifications). Must match the value used for the other template in this pack -
      Engine is a replacement property, so a mismatch destroys and rebuilds the database instead of
      updating it in place.

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class (must match baseline.yaml; the database stays Single-AZ).

  DBMasterUsername:
    Type: String
    Default: ledgeradmin
    MinLength: 4
    Description: RDS master username (must match baseline.yaml).

  DBMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: RDS master password (must match baseline.yaml).

  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: >-
      EC2 instance profile. The Learner Lab supplies LabInstanceProfile (wrapping LabRole); this pack
      creates NO IAM of its own. The profile is what makes Systems Manager Session Manager work, which
      is how the baseline is administered - there is no key pair and no inbound management port. Set
      blank to skip the association if a lab product uses a different name.


Conditions:
  HasInstanceProfile: !Not [!Equals [!Ref InstanceProfileName, '']]

Resources:

  # ---------- Network (unchanged from the baseline) ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.30.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - { Key: Name, Value: !Sub 'enrolline-${EnvName}' }
        - { Key: Project, Value: YAT-Enrolline }
        - { Key: Environment, Value: !Ref EnvName }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub 'enrolline-igw-${EnvName}' }

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicNatA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub 'public-nat-a-${EnvName}' }

  PublicNatB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub 'public-nat-b-${EnvName}' }

  PrivateAppA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - { Key: Name, Value: !Sub 'private-app-a-${EnvName}' }

  PrivateAppB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - { Key: Name, Value: !Sub 'private-app-b-${EnvName}' }

  PrivateDataA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.21.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - { Key: Name, Value: !Sub 'private-data-a-${EnvName}' }

  PrivateDataB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.22.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - { Key: Name, Value: !Sub 'private-data-b-${EnvName}' }

  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicNatA
      Tags:
        - { Key: Name, Value: !Sub 'enrolline-nat-${EnvName}' }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub 'public-rt-${EnvName}' }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicNatAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicNatA

  PublicNatBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicNatB

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub 'private-rt-${EnvName}' }

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateAppAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateAppA

  # IMPROVEMENT: associate the 2nd app subnet so the Multi-AZ ASG has a routed subnet in AZ b
  PrivateAppBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateAppB

  # IMPROVEMENT (network): Gateway endpoint for Amazon S3. Document traffic from the application
  # tier stops leaving the VPC through the NAT Gateway - it removes a NAT data-processing charge
  # and removes the NAT Gateway as a dependency for reaching student document attachments.
  S3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # IMPROVEMENT (network): VPC flow logs. The DPDP Act's security-safeguard obligations assume the
  # ability to detect and investigate a personal-data breach; the baseline keeps no network record
  # at all. Delivered to S3 rather than CloudWatch Logs because an S3 destination needs only a
  # bucket policy - the lab role cannot create the IAM role a CloudWatch destination requires.
  FlowLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'enrolline-flowlogs-${EnvName}-${AWS::Region}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-flow-logs
            Status: Enabled
            ExpirationInDays: 180

  FlowLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FlowLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSLogDeliveryWrite
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub '${FlowLogsBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control
          - Sid: AWSLogDeliveryCheck
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action:
              - 's3:GetBucketAcl'
              - 's3:ListBucket'
            Resource: !GetAtt FlowLogsBucket.Arn

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    DependsOn: FlowLogsBucketPolicy
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: s3
      LogDestination: !GetAtt FlowLogsBucket.Arn
      Tags:
        - { Key: Name, Value: !Sub 'enrolline-flowlogs-${EnvName}' }

  # ---------- Security groups (unchanged) ----------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB - HTTP from internal (VPN-connected) clients only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 10.30.0.0/16, Description: HTTP from internal clients }
      Tags:
        - { Key: Name, Value: !Sub 'sg-alb-${EnvName}' }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App tier - HTTP from the internal ALB; administered via Session Manager
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref AlbSecurityGroup, Description: HTTP from ALB }
      Tags:
        - { Key: Name, Value: !Sub 'sg-app-${EnvName}' }

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database - PostgreSQL (5432) from the app tier only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup, Description: PostgreSQL from app }
      Tags:
        - { Key: Name, Value: !Sub 'sg-db-${EnvName}' }

  # ---------- Compute (IMPROVED: Auto Scaling group now spans TWO AZs) ----------
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub 'enrolline-app-${EnvName}'
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: !If
          - HasInstanceProfile
          - Name: !Ref InstanceProfileName
          - !Ref AWS::NoValue
        SecurityGroupIds:
          - !Ref AppSecurityGroup
        UserData:
          Fn::Base64: |
            #!/bin/bash
            dnf install -y httpd
            systemctl enable --now httpd
            echo "Enrolline infrastructure ready - awaiting application deployment" > /var/www/html/index.html
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub 'enrolline-app-${EnvName}' }
              - { Key: Project, Value: YAT-Enrolline }

  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub 'enrolline-app-${EnvName}'
      MinSize: '2'                    # IMPROVED: was 1
      MaxSize: '4'                    # IMPROVED: was 2
      DesiredCapacity: '2'            # IMPROVED: was 1
      VPCZoneIdentifier:
        - !Ref PrivateAppA            # IMPROVED: now spans BOTH AZs (application-tier Multi-AZ)
        - !Ref PrivateAppB
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref AppTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - { Key: Name, Value: !Sub 'enrolline-app-${EnvName}', PropagateAtLaunch: true }

  AppScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 70

  # IMPROVEMENT (compute): scheduled capacity against the academic calendar. The intake enrolment
  # windows and census dates are published months ahead, so capacity is raised on a schedule -
  # before the load arrives - rather than reactively by the CPU policy after users are already
  # queuing. Outside those windows the group drops back, which is where the cost saving comes from.
  ScheduledScaleUpIntake:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      # 1 Feb and 1 Jul - ahead of each intake enrolment window
      Recurrence: '0 6 1 2,7 *'
      MinSize: 2
      MaxSize: 4
      DesiredCapacity: 4

  ScheduledScaleDownPostIntake:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      # 1 Apr and 1 Oct - after each intake window and its census processing have closed
      Recurrence: '0 6 1 4,10 *'
      MinSize: 2
      MaxSize: 4
      DesiredCapacity: 2

  # ---------- Internal load balancer (unchanged) ----------
  AppLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'enrolline-${EnvName}'
      Scheme: internal
      Type: application
      Subnets:
        - !Ref PrivateAppA
        - !Ref PrivateAppB
      SecurityGroups:
        - !Ref AlbSecurityGroup

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'enrolline-${EnvName}'
      VpcId: !Ref Vpc
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: '200'

  AppListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  # ---------- Database (IMPROVED: converted to a Multi-AZ deployment with a standby) ----------
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Enrolline data subnets (spans 2 AZs - the standby lands in the second)
      SubnetIds:
        - !Ref PrivateDataA
        - !Ref PrivateDataB

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub 'enrolline-${EnvName}'
      Engine: !Ref DBEngine
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: '20'
      MultiAZ: true                   # IMPROVED - synchronous standby in the 2nd AZ, automatic failover
      StorageEncrypted: true
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Ref DBMasterPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      # Retention widening to 14 days is now an OUT-OF-BAND DR step: the AWS Academy lab role denies
      # rds:ModifyDBInstance, so the change-set must not modify the DB. See README. (Real-world IaC
      # with full IAM could set 14 here; the lab cannot, and the legacy DB tier is hands-off anyway.)
      BackupRetentionPeriod: 7        # UNCHANGED from baseline - DB is untouched by this change-set
      PubliclyAccessible: false
      Tags:
        - { Key: Name, Value: !Sub 'enrolline-${EnvName}' }
        - { Key: Project, Value: YAT-Enrolline }

  # ---------- Storage (IMPROVED: lifecycle tiering on attachments for cost) ----------
  AttachmentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'enrolline-attachments-${EnvName}-${AWS::Region}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:         # IMPROVED: tier older scanned documents to cheaper storage
        Rules:
          - Id: tier-older-attachments
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90
              - StorageClass: GLACIER
                TransitionInDays: 365

  BackupsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'enrolline-backups-${EnvName}-${AWS::Region}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------- Monitoring (unchanged) ----------
  AlarmAppCpuHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'enrolline-app-cpu-high-${EnvName}'
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AppAutoScalingGroup
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AlarmRdsCpuHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'enrolline-rds-cpu-high-${EnvName}'
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  AlbDnsName:
    Description: Internal DNS of the load balancer (reachable from inside the VPC / over the VPN).
    Value: !GetAtt AppLoadBalancer.DNSName

  RdsEndpoint:
    Description: RDS PostgreSQL endpoint address.
    Value: !GetAtt Database.Endpoint.Address

  AttachmentsBucketName:
    Value: !Ref AttachmentsBucket

  BackupsBucketName:
    Value: !Ref BackupsBucket

  VpcId:
    Value: !Ref Vpc
